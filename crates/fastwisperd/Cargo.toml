[package]
name = "fastwisperd"
description = "Daemon do FastWisper: dono da sessão, do socket e (futuramente) dos modelos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["vulkan"]
vulkan = ["fw-core/vulkan"]
cuda = ["fw-core/cuda"]

[dependencies]
fw-core = { workspace = true, features = ["whisper", "pipewire"] }
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
