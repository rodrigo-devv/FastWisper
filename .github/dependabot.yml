version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /ui/src-tauri
    schedule:
      interval: weekly
    groups:
      hub-cargo:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      hub-npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
