name: Question
description: Ask how something works. For open-ended discussion, prefer Discussions.
labels: [question]
body:
  - type: markdown
    attributes:
      value: Please do not paste dictated text, window titles or app names.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FastWisper version (optional)
      description: Output of `fastwisper --version`.
