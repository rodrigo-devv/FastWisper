name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please do not paste dictated text, audio, window titles or app/window class names.**
        Describe what happened in general terms instead (for example "pasting into a terminal").
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `fastwisper ...`
        2. Press Alt+Space ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FastWisper version
      description: Output of `fastwisper --version`.
      placeholder: fastwisper 0.1.0
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `fastwisper doctor`
      description: Review it before posting and remove anything you consider private (paths with your user name, device names).
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Distribution and version, Hyprland version, GPU vendor (or CPU only), install method (install.sh, release tarball, other).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (optional)
      description: For example `journalctl --user -u fastwisperd --since "10 min ago"`. Remove any personal data first.
      render: text
